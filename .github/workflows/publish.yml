name: Publish

# Releases are cut from a tag, never from a plain push.
#
# PyPI versions are immutable: once 0.5.0 is uploaded that number is spent
# forever, and a mistake can only be followed by 0.5.1. Publishing on every
# push to main would either fail on the second push (version already there) or
# ship straight to every `pip install` with no review. Tagging makes the release
# an explicit act.
#
#   git tag 0.5.0 && git push origin 0.5.0
#
# Run this manually from the Actions tab for a dry run: it builds, checks the
# metadata and installs the wheel into a clean environment, but uploads nothing.

on:
  push:
    tags:
      # Existing tags are bare numbers (0.3.1, 0.4.0). A leading v is accepted
      # too, since the version check strips it either way.
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build twine opencv-python-headless
          pip install -e .
          pip install pytest selenium

      - name: Test
        run: pytest -q

      # A tag that disagrees with the packaged version would publish the wrong
      # number under the wrong name, and neither can be taken back.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, sys, tomllib, pathlib

          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']

          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject.toml version {version}")
          print(f"tag and version agree: {version}")
          PY

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      # Installing the built wheel somewhere clean catches what a broken sdist
      # or a missing dependency would only show after the upload, by which point
      # the version number is spent.
      - name: Install the wheel into a clean environment and use it
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          /tmp/fresh/bin/python - <<'PY'
          import numpy as np, cv2, pyxelator
          from pyxelator import find_image_in_screenshot

          print("installed version:", pyxelator.__version__)

          rng = np.random.default_rng(1)
          page = np.full((300, 400, 3), 240, np.uint8)
          page[180:204, 250:310] = rng.integers(0, 256, size=(24, 60, 3), dtype=np.uint8)
          cv2.imwrite('button.png', page[180:204, 250:310])
          shot = cv2.imencode('.png', page)[1].tobytes()

          assert find_image_in_screenshot(shot, 'button.png') == (280, 192)

          cv2.imwrite('flat.png', np.full((40, 40, 3), 200, np.uint8))
          assert find_image_in_screenshot(shot, 'flat.png') is None
          print("the installed package matches and rejects as expected")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  # Downloading the artifact is the one step a dry run would otherwise never
  # reach, and download-artifact v8 changed when it unzips. Exercising it on a
  # manual run means a tag is not the first time it executes: a surprise there
  # leaves the release half done with the version number already spent.
  verify-download:
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Confirm the distributions arrived unpacked
        run: |
          ls -l dist/
          test -f dist/pyxelator-*.whl || { echo "no wheel in dist/" >&2; exit 1; }
          test -f dist/pyxelator-*.tar.gz || { echo "no sdist in dist/" >&2; exit 1; }
          if ls dist/*.zip >/dev/null 2>&1; then
            echo "artifact arrived still zipped; the publish job would upload nothing" >&2
            exit 1
          fi
          echo "both distributions present and unpacked"

  # Only a tag publishes. A manual run stops after build, so the dry run above
  # can never upload by accident, and the version check can never be bypassed.
  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi   # add a required reviewer here for an approval gate
    permissions:
      id-token: write   # mints the short-lived OIDC token; no stored secret
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
