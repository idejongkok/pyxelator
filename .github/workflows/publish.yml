name: Publish

# Releases are cut from a tag, never from a plain push.
#
# PyPI versions are immutable: once 0.5.0 is uploaded that number is spent
# forever, and a mistake can only be followed by 0.5.1. Publishing on every
# push to main would either fail on the second push (version already there) or
# ship straight to every `pip install` with no review. Tagging makes the release
# an explicit act.
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Use workflow_dispatch to rehearse against TestPyPI first.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install build twine opencv-python-headless
          pip install -e .
          pip install pytest selenium

      - name: Test
        run: pytest -q

      # A tag that disagrees with the packaged version would publish the wrong
      # number under the wrong name, and neither can be taken back.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, sys, tomllib, pathlib

          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']

          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject.toml version {version}")
          print(f"tag and version agree: {version}")
          PY

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # mints the short-lived OIDC token; no stored secret
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi   # add a required reviewer here for an approval gate
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
