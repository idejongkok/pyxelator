name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fork pull requests run with a read-only token and no access to secrets.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # opencv-python needs a display library that the runner lacks;
          # the headless build is identical for our purposes.
          pip install opencv-python-headless
          pip install -e .
          pip install pytest selenium

      - name: Test
        run: pytest -q

      - name: Check the package imports with only OpenCV present
        run: |
          pip uninstall -y selenium
          python -c "import pyxelator; print(pyxelator.__version__)"
